<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075b4d">
  <title>بنزين الموصل</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">⛽ بنزين الموصل</div>
      <div class="tagline">وين تحصل حصتك بأقل وقت وجهد ممكن</div>
    </div>
    <button id="locateBtn" class="iconBtn" title="موقعي">⌖</button>
  </header>

  <main>
    <section class="searchWrap">
      <input id="search" type="search" placeholder="ابحث عن محطة أو منطقة..." />
      <button id="nearBtn">الأقرب</button>
    </section>

    <section class="stats">
      <div><b id="availableCount">—</b><span>متوفر</span></div>
      <div><b id="busyCount">—</b><span>ازدحام</span></div>
      <div><b id="emptyCount">—</b><span>نافد</span></div>
      <div><b id="unknownCount">—</b><span>غير معروف</span></div>
    </section>

    <div id="map"></div>

    <section class="recommend">
      <div class="sectionTitle">
        <h2>أفضل خيار الآن</h2><span id="dataAge">جاري التحميل...</span>
      </div>
      <div id="bestCard" class="bestCard"></div>
    </section>

    <section class="filters">
      <button class="filter active" data-filter="all">الكل</button>
      <button class="filter" data-filter="available">متوفر</button>
      <button class="filter" data-filter="busy">ازدحام</button>
      <button class="filter" data-filter="empty">نافد</button>
    </section>

    <section id="stationList" class="stationList"></section>
  </main>

  <nav class="bottomNav">
    <button class="nav active" data-tab="mapTab">🗺️<span>الخريطة</span></button>
    <button class="nav" data-tab="updates">🔄<span>التحديثات</span></button>
    <button class="nav" data-tab="services">🧰<span>خدمات</span></button>
    <button class="nav" data-tab="account">👤<span>حسابي</span></button>
  </nav>

  <dialog id="reportDialog">
    <div class="dialogHead"><h3>تحديث حالة المحطة</h3><button id="closeDialog">×</button></div>
    <p id="dialogStation"></p>
    <div class="reportGrid">
      <button data-status="available">⛽<strong>البنزين موجود</strong></button>
      <button data-status="empty">🚫<strong>البنزين نافد</strong></button>
      <button data-status="light">🚗<strong>ازدحام خفيف</strong></button>
      <button data-status="medium">🚙<strong>ازدحام متوسط</strong></button>
      <button data-status="heavy">🚕<strong>ازدحام شديد</strong></button>
    </div>
    <label class="field">عدد السيارات التقريبي
      <input id="carsInput" type="number" min="0" placeholder="مثلاً 50">
    </label>
    <button id="sendReport" class="primary">إرسال التحديث</button>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
    </html>
